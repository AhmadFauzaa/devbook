<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Book - Toko Buku Modern</title>
    <link rel="icon" type="image/x-icon" href="fav.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }
        .page-transition {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 transition-colors duration-300">

    <!-- Navigation Bar -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
                    <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white shadow-lg shadow-indigo-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="Ref: M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-800">Dev Book</span>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-8">
                    <button onclick="navigateTo('home')" class="nav-link text-slate-600 hover:text-indigo-600 font-medium transition-colors" id="nav-home">Home</button>
                    <button onclick="navigateTo('about')" class="nav-link text-slate-600 hover:text-indigo-600 font-medium transition-colors" id="nav-about">Tentang</button>
                    <button onclick="navigateTo('creator')" class="nav-link text-slate-600 hover:text-indigo-600 font-medium transition-colors" id="nav-creator">Pembuat</button>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="p-2 text-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-slate-200 px-4 py-4 space-y-4">
            <button onclick="navigateTo('home')" class="block w-full text-left text-slate-600 font-medium">Home</button>
            <button onclick="navigateTo('about')" class="block w-full text-left text-slate-600 font-medium">Tentang</button>
            <button onclick="navigateTo('creator')" class="block w-full text-left text-slate-600 font-medium">Pembuat</button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main id="app-content" class="min-h-screen">
        <!-- Content will be injected here by JS -->
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <div class="flex justify-center items-center gap-2 mb-4">
                <div class="w-8 h-8 bg-indigo-500 rounded flex items-center justify-center text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <span class="text-white font-bold text-lg">Dev Book</span>
            </div>
            <p class="text-sm">© 2024 Dev Bookstore. Dibuat dengan penuh ❤️ untuk pecinta buku.</p>
        </div>
    </footer>

    <script>
        // Database Buku Mockup
        const books = [
            { id: 1, title: "Kisah Akito", author: "Ahmad Fauzan", price: "Rp 5.000", category: "Fiksi", imgsrc: "image.jpeg" },
            { id: 2, title: "Bunga Kopi dan Ahmad Si Murid RPL", author: "Ahmad Fauzan", price: "Rp 2.000 -diskon-", category: "Self-Dev", imgsrc: "image2.jpeg" },
        ];

        // Router Sederhana
        function navigateTo(page) {
            const content = document.getElementById('app-content');
            const mobileMenu = document.getElementById('mobile-menu');
            
            // Tutup mobile menu jika terbuka
            mobileMenu.classList.add('hidden');
            
            // Reset active states pada nav
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('text-indigo-600', 'border-b-2', 'border-indigo-600');
            });
            const activeNav = document.getElementById(`nav-${page}`);
            if (activeNav) activeNav.classList.add('text-indigo-600');

            // Render Halaman
            switch(page) {
                case 'home':
                    renderHome(content);
                    break;
                case 'about':
                    renderAbout(content);
                    break;
                case 'creator':
                    renderCreator(content);
                    break;
                default:
                    renderHome(content);
            }
            window.scrollTo(0, 0);
        }

        // --- Render Functions ---

        function renderHome(container) {
            container.innerHTML = `
                <section class="page-transition">
                    <!-- Hero Section -->
                    <div class="bg-gradient-to-r from-indigo-600 to-violet-700 py-20 px-4 text-white">
                        <div class="max-w-7xl mx-auto text-center">
                            <h1 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">Temukan Jendela Dunia<br>Hanya di <span class="text-indigo-200">Dev Book</span></h1>
                            <p class="text-indigo-100 text-lg mb-10 max-w-2xl mx-auto">Ribuan koleksi buku pilihan mulai dari fiksi, pengembangan diri, hingga literatur klasik menunggu untuk Anda jelajahi.</p>
                            <div class="flex flex-wrap justify-center gap-4">
                                <button class="bg-white text-indigo-700 px-8 py-3 rounded-full font-bold shadow-lg hover:bg-indigo-50 transition-all">Lihat Koleksi</button>
                                <button class="border border-indigo-200 text-white px-8 py-3 rounded-full font-bold hover:bg-white/10 transition-all">Promo Bulan Ini</button>
                            </div>
                        </div>
                    </div>

                    <!-- Book Catalog -->
                    <div class="max-w-7xl mx-auto py-16 px-4">
                        <div class="flex justify-between items-end mb-10">
                            <div>
                                <h2 class="text-3xl font-bold text-slate-800">Koleksi Terpopuler</h2>
                                <p class="text-slate-500 mt-2">Buku-buku pilihan yang paling banyak dicari minggu ini.</p>
                            </div>
                            <button class="text-indigo-600 font-semibold hover:underline hidden sm:block">Lihat Semua →</button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                            ${books.map(book => `
                                <div class="book-card bg-white rounded-2xl overflow-hidden border border-slate-100 transition-all duration-300">
                                    <div class="aspect-[4/3] relative overflow-hidden bg-slate-200">
                                        <img src="${book.img}" alt="${book.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x300?text=Buku+Libraria'">
                                        <div class="absolute top-4 left-4">
                                            <span class="bg-indigo-600/90 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-bold">${book.category}</span>
                                        </div>
                                    </div>
                                    <div class="p-6">
                                        <h3 class="text-xl font-bold text-slate-800 mb-1">${book.title}</h3>
                                        <p class="text-slate-500 text-sm mb-4">${book.author}</p>
                                        <div class="flex justify-between items-center">
                                            <span class="text-indigo-600 font-bold text-lg">${book.price}</span>
                                            <button class="p-2 bg-slate-50 rounded-lg hover:bg-indigo-600 hover:text-white transition-colors">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                                                </svg>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Newsletter -->
                    <div class="bg-slate-100 py-16 px-4 mb-20">
                        <div class="max-w-4xl mx-auto text-center">
                            <h2 class="text-2xl font-bold mb-4">Ingin tau update buku terbaru?</h2>
                            <p class="text-slate-600 mb-8">Dapatkan rekomendasi bacaan mingguan langsung di email kamu.</p>
                            <div class="flex flex-col sm:flex-row gap-3">
                                <input type="email" placeholder="Masukkan email kamu" class="flex-grow px-6 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <button class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 transition-all">Berlangganan</button>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        function renderAbout(container) {
            container.innerHTML = `
                <section class="page-transition max-w-7xl mx-auto px-4 py-16">
                    <div class="text-center mb-16">
                        <h1 class="text-4xl font-bold text-slate-900 mb-4">Tentang Dev Book</h1>
                        <p class="text-slate-600 max-w-2xl mx-auto">Kami lebih dari sekadar toko buku. Kami adalah komunitas bagi mereka yang haus akan ilmu dan imajinasi.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center mb-24">
                        <div class="rounded-3xl overflow-hidden shadow-2xl">
                            <img src="https://images.unsplash.com/photo-1507738911731-171738b01244?auto=format&fit=crop&q=80&w=800" alt="Suasana Toko" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <h2 class="text-3xl font-bold mb-6 text-indigo-600">Visi & Misi Kami</h2>
                            <p class="text-slate-600 mb-4 leading-relaxed">Dev Book didirikan pada tahun 2024 dengan mimpi sederhana: membuat buku berkualitas dapat diakses oleh siapa saja dengan pengalaman yang menyenangkan.</p>
                            <ul class="space-y-4">
                                <li class="flex gap-3">
                                    <div class="flex-shrink-0 w-6 h-6 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold text-xs">1</div>
                                    <p class="text-slate-600"><span class="font-bold">Literasi Nasional:</span> Meningkatkan minat baca masyarakat Indonesia melalui koleksi yang relevan.</p>
                                </li>
                                <li class="flex gap-3">
                                    <div class="flex-shrink-0 w-6 h-6 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold text-xs">2</div>
                                    <p class="text-slate-600"><span class="font-bold">Kurasi Terbaik:</span> Setiap buku yang kami jual telah melalui proses pemilihan yang ketat.</p>
                                </li>
                                <li class="flex gap-3">
                                    <div class="flex-shrink-0 w-6 h-6 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center font-bold text-xs">3</div>
                                    <p class="text-slate-600"><span class="font-bold">Teknologi:</span> Memberikan pengalaman belanja yang modern dan mulus.</p>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="bg-indigo-50 p-12 rounded-3xl text-center">
                        <h2 class="text-2xl font-bold mb-6">Lokasi Fisik</h2>
                        <p class="text-slate-700 mb-2 font-medium">Jl. Sungai Langka
Kec. Gedong Tataan
Kabupaten Pesawaran
Lampung</p>
                        <p class="text-slate-600">Lampung, Indonesia</p>
                        <div class="mt-8 flex justify-center gap-4">
                            <button class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium">Buka Google Maps</button>
                        </div>
                    </div>
                </section>
            `;
        }

        function renderCreator(container) {
            container.innerHTML = `
                <section class="page-transition max-w-7xl mx-auto px-4 py-20 flex flex-col items-center">
                    <div class="relative mb-10">
                        <div class="w-40 h-40 rounded-full bg-indigo-100 border-4 border-white shadow-xl overflow-hidden">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Foto Pembuat" class="w-full h-full object-cover">
                        </div>
                        <div class="absolute bottom-2 right-2 w-8 h-8 bg-green-500 border-4 border-white rounded-full"></div>
                    </div>
                    
                    <div class="text-center max-w-xl">
                        <h1 class="text-3xl font-bold text-slate-900 mb-2">Ahmad Developer</h1>
                        <p class="text-indigo-600 font-semibold mb-6">Fullstack Developer & Pecinta Buku</p>
                        <p class="text-slate-600 mb-8 leading-relaxed">
                            Halo! Saya Ahmad, kreator dibalik Libraria. Saya membuat platform ini untuk menggabungkan dua minat terbesar saya: Pemrograman dan Literasi. Melalui website ini, saya berharap orang-orang bisa menemukan teman baru dalam bentuk buku.
                        </p>

                        <div class="flex justify-center gap-6 mb-12">
                            <a href="#" class="text-slate-400 hover:text-indigo-600 transition-colors">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                            </a>
                            <a href="#" class="text-slate-400 hover:text-indigo-600 transition-colors">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                            </a>
                            <a href="#" class="text-slate-400 hover:text-indigo-600 transition-colors">
                                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.042-1.416-4.042-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                            </a>
                        </div>

                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full">
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                <p class="text-2xl font-bold text-indigo-600">50+</p>
                                <p class="text-xs text-slate-500 uppercase tracking-widest">Projects</p>
                            </div>
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                <p class="text-2xl font-bold text-indigo-600">3yr</p>
                                <p class="text-xs text-slate-500 uppercase tracking-widest">Experience</p>
                            </div>
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                <p class="text-2xl font-bold text-indigo-600">99+</p>
                                <p class="text-xs text-slate-500 uppercase tracking-widest">Books Read</p>
                            </div>
                            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                <p class="text-2xl font-bold text-indigo-600">12k</p>
                                <p class="text-xs text-slate-500 uppercase tracking-widest">Lines Code</p>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        // --- Event Listeners ---

        document.getElementById('mobile-menu-button').addEventListener('click', () => {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });

        // Initialize App
        window.onload = () => {
            navigateTo('home');
        };

    </script>
</body>
</html>
